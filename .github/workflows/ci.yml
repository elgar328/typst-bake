name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    env:
      # Fail if any dependency compiles C for wasm (host builds are unaffected).
      CC_wasm32_unknown_unknown: "false"
      AR_wasm32_unknown_unknown: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2

      # All features include `js-clock`; `full` alone is the default build without a clock.
      - name: Clippy (wasm)
        run: |
          cargo clippy -p typst-bake --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo clippy -p typst-bake --target wasm32-unknown-unknown --features full -- -D warnings

      # Written to a file first so that a failing `cargo tree` fails the step.
      - name: No JavaScript imports by default
        run: |
          cargo tree -p typst-bake --target wasm32-unknown-unknown --features full -e normal > wasm-tree.txt
          ! grep -E 'wasm-bindgen|js-sys' wasm-tree.txt

      # Building a binary links it, which is where a C dependency would fail.
      - name: Build example for wasm
        run: cargo build -p example-output-formats --target wasm32-unknown-unknown
