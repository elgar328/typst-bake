[workspace]
members = [
    "typst-bake",
    "typst-bake-macros",
    "examples/font-guide",
    "examples/with-inputs",
    "examples/with-package",
    "examples/with-files",
    "examples/quick-start",
    "examples/output-formats",
    "examples/compression-levels",
    "examples/compression-levels/wasm-decoder",
    "examples/test-nested-entry",
    "examples/with-runtime-files",
    "examples/test-page-selection",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
# Internal crates
typst-bake = { version = "=0.3.0", path = "typst-bake" }
typst-bake-macros = { version = "=0.3.0", path = "typst-bake-macros" }

# Typst
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-render = "0.15"
typst-syntax = "0.15"
typst-layout = "0.15"
# Font metadata is serialized by the macros with this crate and read back by `typst` at
# runtime, so it must stay on the same minor line as `typst` (a unit test checks Cargo.lock).
typst-library = "0.15"
# Only the clock behind `datetime.today()`.
typst-kit = { version = "0.15", default-features = false, features = ["datetime"] }

# Proc macro
proc-macro2 = "1"
quote = "1"
syn = "3"

# Dates
# Only the clock: chrono's default `wasmbind` would make wasm32-unknown-unknown builds import
# JavaScript. typst-bake's `js-clock` feature turns it on deliberately.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Compression
zstd = "0.14"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
flate2 = "1"
blake3 = "1"

# Serialization
serde_json = "1"

# Error handling
thiserror = "2"

# Utilities
include_dir = "0.7"
ureq = "3.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
binstall-tar = "0.4"
toml = "1.1"
walkdir = "2"
dirs = "7"
fd-lock = "4.0"
