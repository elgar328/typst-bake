[package]
name = "typst-bake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bake Typst templates, fonts, and packages into your Rust binary — use Typst as a self-contained, embedded library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elgar328/typst-bake"
readme = "../README.md"
keywords = ["typst", "pdf", "template", "embedded"]
categories = ["template-engine", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["pdf", "js-clock"]
pdf = ["dep:typst-pdf"]
svg = ["dep:typst-svg"]
png = ["dep:typst-render"]
full = ["pdf", "svg", "png"]
# wasm32-unknown-unknown has no clock. Read it from JavaScript `Date` through wasm-bindgen, for
# `datetime.today()` and `PdfTimestamp::now`. No effect on other targets. Hosts without
# JavaScript turn it off and use `Document::with_now`.
js-clock = ["chrono/wasmbind"]

[dependencies]
typst-bake-macros.workspace = true
typst.workspace = true
typst-pdf = { workspace = true, optional = true }
typst-svg = { workspace = true, optional = true }
typst-render = { workspace = true, optional = true }
typst-layout.workspace = true
typst-kit.workspace = true
chrono.workspace = true
include_dir.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

# The runtime only decompresses. WebAssembly uses a pure-Rust decoder so that building for wasm
# needs no C toolchain for the target; native targets keep the faster C library.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zstd.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
ruzstd.workspace = true

[dev-dependencies]
# Tests the wasm decoder on native targets.
ruzstd.workspace = true
